version: "3.3"

services:
  skiresort-next:
    container_name: skiresort-next
    restart: always
    image: node:20.19.0
    ports:
      - 4000:3000
    volumes:
      - ./:/usr/src/skiresort-next
    working_dir: /usr/src/skiresort-next
    environment:
      PORT_API: 3000

    networks:
      - client-network

    # FOR PRODUCTION
    command: bash -c "yarn && yarn run build && yarn run start"

networks:
  client-network:
    driver: bridge
